[project]
name = "odoo-liberate"
version = "0.1.0"
description = "A zero-dependency CLI tool to migrate Odoo Enterprise databases to Community Edition by stripping proprietary artifacts."
authors = [{ name = "tiborrr", email = "tibor@casteleijn.com" }]
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

keywords = ["odoo", "migration", "database", "community", "enterprise"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/tiborrr/odoo-liberate"
Repository = "https://github.com/tiborrr/odoo-liberate"
Issues = "https://github.com/tiborrr/odoo-liberate/issues"

[project.scripts]
odoo-liberate = "odoo_liberate.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
